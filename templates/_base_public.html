{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gagasan PNJ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    
    <header class="bg-white/95 backdrop-blur-lg border-b sticky top-0 z-50 shadow-sm border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <a href="{% url 'catalog' %}" class="flex items-center gap-3">
                    <div class="h-10 w-10 rounded-xl bg-white p-1 shadow-md shadow-teal-100 flex items-center justify-center border border-teal-50">
                        <img src="{% static 'images/LOGO GAGASAN.png' %}" alt="Logo" class="h-full w-full object-contain" />
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold text-gray-900 tracking-tight">GAGASAN</h1>
                    </div>
                </a>
                <div class="flex items-center gap-3">
                     <a href="{% url 'catalog' %}" class="text-sm font-bold text-gray-600 hover:text-teal-600 px-3 py-2">Katalog</a>
                     <a href="{% url 'login' %}" class="flex items-center gap-2 px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl transition-all shadow-md font-bold text-sm">
                        Masuk
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        {% block dashboard_content %}{% endblock %}
    </main>

    <footer class="bg-[#004D40] text-teal-100 py-8 border-t border-teal-800 mt-auto">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="font-medium text-sm">&copy; 2025 Gagasan - Politeknik Negeri Jakarta</p>
      </div>
    </footer>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
